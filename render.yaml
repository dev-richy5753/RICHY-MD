services:
  - type: web
    name: richy-md
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_TELEGRAM_ID
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
