name: Render keep-alive

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-health-ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate and ping Render
        env:
          RENDER_HEALTH_URL: ${{ vars.RENDER_HEALTH_URL || 'https://richy-md-scuq.onrender.com' }}
        run: |
          node -e 'const url = new URL(process.env.RENDER_HEALTH_URL); if (url.protocol !== "https:" || !url.hostname.endsWith(".onrender.com") || url.pathname !== "/" || url.search || url.hash) process.exit(1)'
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --retry 2 --retry-delay 5 \
            "${RENDER_HEALTH_URL%/}/health"
